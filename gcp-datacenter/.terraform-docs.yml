# Configuración de terraform-docs. scripts/docs.sh la usa para llenar el README.md de cada
# módulo y raíz entre los marcadores BEGIN_TF_DOCS / END_TF_DOCS (modo inyección: el texto
# fuera de los marcadores lo escribe una persona y no se toca).

formatter: "markdown table"

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

settings:
  anchor: true
  default: true
  description: true
  escape: true
  hide-empty: false
  html: true
  indent: 2
  lockfile: false
  read-comments: true
  required: true
  sensitive: true
  type: true
