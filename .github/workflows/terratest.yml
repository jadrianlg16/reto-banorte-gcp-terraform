# Terratest (CONTRATO §9.2 y §9.3). Ver docs/pipeline.md.
#
# Disparo: nocturno, manual y al crear una etiqueta de versión de módulo
# (modules/<módulo>/vX.Y.Z).
#
# compile (siempre): go vet ./... y go test -run XXX ./... en gcp-datacenter/tests, que
#   compila las pruebas sin ejecutar ninguna. Si todavía no existe tests/go.mod, el trabajo
#   lo avisa y termina en verde.
# integration (solo con GCP_ENABLED = "true"): corre las pruebas reales con Workload
#   Identity Federation y la cuenta de servicio de pruebas. Por defecto todas corren en el
#   proyecto único de pruebas TERRATEST_PROJECT_ID (ADR 0029: sin carpetas ni organización),
#   con nombres únicos por corrida, y cada una destruye lo que creó. Con
#   TEST_EPHEMERAL_PROJECTS = "true", cada prueba crea y destruye su propio proyecto efímero
#   (necesita facturación y una carpeta u organización).
#   - Nocturno y manual: todos los paquetes salvo tests/e2e (la prueba de extremo a extremo
#     aplica 0 → 3 y se lanza a mano).
#   - Etiqueta modules/<módulo>/vX.Y.Z: solo las pruebas de ese módulo
#     (scripts/module-tests.sh). La etiqueta no fija versiones: las raíces usan rutas relativas.
#   - Omitidas: scripts/go-test-report.sh lista en el resumen cada prueba omitida con su
#     motivo y hace fallar el trabajo si hay más omitidas que TERRATEST_MAX_SKIPS (0 si no se
#     define). Para aceptar omisiones hay que subir ese número a propósito.
#
# Variables de repositorio de las pruebas reales (los nombres de entorno que reciben las
# pruebas de Go son los mismos):
#   TERRATEST_SERVICE_ACCOUNT  correo de la cuenta de servicio de pruebas (no es de una etapa).
#   TERRATEST_PROJECT_ID       proyecto único de pruebas, donde corren todas por defecto. Tiene
#                              que ser otro que el de la landing zone: si es igual a
#                              GCP_TFVARS_JSON.common.project_id, el trabajo falla antes de
#                              correr pruebas (scripts/terratest-project-check.py).
#   TEST_EPHEMERAL_PROJECTS    "true": un proyecto efímero por prueba (opcional).
#   TERRATEST_BILLING_ACCOUNT  cuenta de facturación de los proyectos efímeros (solo con
#                              TEST_EPHEMERAL_PROJECTS).
#   TERRATEST_ORG_ID           ID numérico de la organización (proyectos efímeros sin carpeta y
#                              pruebas de organización; opcional).
#   TERRATEST_FOLDER_ID        carpeta donde se crean los proyectos efímeros (opcional).
#   TERRATEST_MAX_SKIPS        máximo de pruebas omitidas aceptado (por defecto 0).
#   TEST_ALLOW_EXPENSIVE, TEST_ALLOW_ORG, TEST_DIRECTORY_CUSTOMER_ID, TEST_ACCESS_POLICY_ID,
#   TEST_NOTIFICATION_EMAIL, TEST_GKE_SECURITY_GROUP, TEST_MIG_IMAGE, TEST_CLOUD_RUN_IMAGE,
#   TEST_LB_DOMAIN, TEST_REGION, TEST_DR_REGION: compuertas y datos de las pruebas
#   (gcp-datacenter/tests/README.md). Sin ellas, las pruebas que las piden se omiten.

name: terratest

on:
  schedule:
    - cron: "41 6 * * *" # nocturno, 06:41 UTC
  workflow_dispatch:
  push:
    tags:
      - "modules/*/v*"

permissions:
  contents: read

concurrency:
  group: terratest-${{ github.ref }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.16.5"
  TESTS_DIR: gcp-datacenter/tests

defaults:
  run:
    shell: bash
    working-directory: gcp-datacenter

jobs:
  compile:
    name: compilar (go vet y go test -run XXX)
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.mod.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: mod
        name: ¿Existe tests/go.mod?
        run: |
          if [ -f tests/go.mod ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::No existe gcp-datacenter/tests/go.mod todavía: no hay pruebas que compilar."
          fi
          if [ -f tests/go.sum ]; then
            echo "gosum=true" >> "${GITHUB_OUTPUT}"
          else
            echo "gosum=false" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.mod.outputs.present == 'true'
        with:
          go-version-file: ${{ env.TESTS_DIR }}/go.mod
          # Sin go.sum no hay con qué calcular la llave de la caché.
          cache: ${{ steps.mod.outputs.gosum == 'true' }}
          cache-dependency-path: ${{ env.TESTS_DIR }}/go.sum

      - name: go vet ./...
        if: steps.mod.outputs.present == 'true'
        working-directory: ${{ env.TESTS_DIR }}
        run: go vet ./...

      - name: go test -run XXX ./... (solo compila)
        if: steps.mod.outputs.present == 'true'
        working-directory: ${{ env.TESTS_DIR }}
        run: go test -count=1 -run XXX ./...

  integration:
    name: pruebas reales en GCP
    if: vars.GCP_ENABLED == 'true' && needs.compile.outputs.present == 'true'
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    env:
      TERRATEST_PROJECT_ID: ${{ vars.TERRATEST_PROJECT_ID }}
      TEST_EPHEMERAL_PROJECTS: ${{ vars.TEST_EPHEMERAL_PROJECTS }}
      TERRATEST_BILLING_ACCOUNT: ${{ vars.TERRATEST_BILLING_ACCOUNT }}
      TERRATEST_ORG_ID: ${{ vars.TERRATEST_ORG_ID }}
      TERRATEST_FOLDER_ID: ${{ vars.TERRATEST_FOLDER_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.TERRATEST_PROJECT_ID }}
      TEST_ALLOW_EXPENSIVE: ${{ vars.TEST_ALLOW_EXPENSIVE }}
      TEST_ALLOW_ORG: ${{ vars.TEST_ALLOW_ORG }}
      TEST_DIRECTORY_CUSTOMER_ID: ${{ vars.TEST_DIRECTORY_CUSTOMER_ID }}
      TEST_ACCESS_POLICY_ID: ${{ vars.TEST_ACCESS_POLICY_ID }}
      TEST_NOTIFICATION_EMAIL: ${{ vars.TEST_NOTIFICATION_EMAIL }}
      TEST_GKE_SECURITY_GROUP: ${{ vars.TEST_GKE_SECURITY_GROUP }}
      TEST_MIG_IMAGE: ${{ vars.TEST_MIG_IMAGE }}
      TEST_CLOUD_RUN_IMAGE: ${{ vars.TEST_CLOUD_RUN_IMAGE }}
      TEST_LB_DOMAIN: ${{ vars.TEST_LB_DOMAIN }}
      TEST_REGION: ${{ vars.TEST_REGION }}
      TEST_DR_REGION: ${{ vars.TEST_DR_REGION }}
      MAX_SKIPS: ${{ vars.TERRATEST_MAX_SKIPS || '0' }}
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Comprobar variables de pruebas
        env:
          TERRATEST_SERVICE_ACCOUNT: ${{ vars.TERRATEST_SERVICE_ACCOUNT }}
        run: |
          # Proyecto único (por defecto): la cuenta y el proyecto. Proyectos efímeros: además la
          # facturación y una carpeta u organización donde crearlos.
          required="TERRATEST_SERVICE_ACCOUNT TERRATEST_PROJECT_ID"
          if [ "${TEST_EPHEMERAL_PROJECTS:-}" = "true" ]; then
            required="${required} TERRATEST_BILLING_ACCOUNT"
            if [ -z "${TERRATEST_FOLDER_ID:-}" ]; then
              required="${required} TERRATEST_ORG_ID"
            fi
          fi
          missing=""
          for v in ${required}; do
            if [ -z "${!v:-}" ]; then
              missing="${missing} ${v}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Faltan variables de repositorio:${missing} (ver docs/pipeline.md)."
            exit 1
          fi

      # Falla si TERRATEST_PROJECT_ID es el proyecto de la landing zone
      # (GCP_TFVARS_JSON.common.project_id), sin imprimir ninguno de los dos, y deja ese proyecto
      # en TERRATEST_LANDING_ZONE_PROJECT_ID para que cada prueba lo vuelva a comprobar
      # (tests/helpers, RequireProjectEnv).
      - name: El proyecto de pruebas no es el de la landing zone
        env:
          TFVARS_JSON: ${{ vars.GCP_TFVARS_JSON }}
        run: python3 scripts/terratest-project-check.py "${GITHUB_ENV}"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ env.TESTS_DIR }}/go.mod
          cache: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Autenticar con Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRATEST_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Etiqueta modules/<módulo>/vX.Y.Z: solo las pruebas de ese módulo. Si no, todo salvo e2e.
      - name: Pruebas a correr
        id: select
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          run_regex="."
          if [ "${REF_TYPE}" = "tag" ]; then
            module="$(printf '%s' "${REF_NAME}" | sed -n -E 's#^modules/([a-z0-9-]+)/v[0-9]+\.[0-9]+\.[0-9]+$#\1#p')"
            if [ -z "${module}" ]; then
              echo "::error::La etiqueta ${REF_NAME} no tiene la forma modules/<módulo>/vX.Y.Z."
              exit 1
            fi
            run_regex="$(bash scripts/module-tests.sh "${module}")"
            echo "Etiqueta ${REF_NAME}: pruebas ${run_regex}" >> "${GITHUB_STEP_SUMMARY}"
          fi
          echo "run=${run_regex}" >> "${GITHUB_OUTPUT}"

      - name: go test (sin tests/e2e)
        working-directory: ${{ env.TESTS_DIR }}
        env:
          RUN_REGEX: ${{ steps.select.outputs.run }}
        run: |
          pkgs="$(go list ./... | grep -v -E '/e2e(/|$)' || true)"
          if [ -z "${pkgs}" ]; then
            echo "::error::No hay paquetes de prueba fuera de e2e."
            exit 1
          fi
          log="${RUNNER_TEMP}/go-test.json"
          set +e
          # shellcheck disable=SC2086 # una palabra por paquete
          go test -count=1 -json -timeout 170m -run "${RUN_REGEX}" ${pkgs} > "${log}"
          code=$?
          set -e
          echo "### Terratest" >> "${GITHUB_STEP_SUMMARY}"
          bash ../scripts/go-test-report.sh "${log}" "${MAX_SKIPS}" "${GITHUB_STEP_SUMMARY}" || code=1
          exit "${code}"

      - name: Registro de go test
        if: always()
        working-directory: ${{ env.TESTS_DIR }}
        run: |
          # Salida legible de las pruebas (el JSON lleva lo mismo línea por línea).
          if [ -f "${RUNNER_TEMP}/go-test.json" ]; then
            sed -n -E 's/.*"Action":"output".*"Output":"(.*)"\}$/\1/p' "${RUNNER_TEMP}/go-test.json" |
              sed -e 's/\\n$//' -e 's/\\t/\t/g' -e 's/\\"/"/g'
          fi
