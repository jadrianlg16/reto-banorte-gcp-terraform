# Detección diaria de drift (CONTRATO §9.3). Ver docs/pipeline.md.
#
# Por cada raíz de stages/ salvo 0-bootstrap: terraform plan -detailed-exitcode -lock=false
# con la cuenta de servicio de la etapa (Workload Identity Federation, sin llaves).
#   código 0  sin cambios: no hace nada.
#   código 2  drift: abre una incidencia con la etiqueta `drift` para esa raíz o, si ya hay
#             una abierta, actualiza su cuerpo y agrega un comentario.
#   código 1  error: el trabajo falla.
# -lock=false: el plan no escribe estado, así que no bloquea ni espera a un apply en curso.
#
# La incidencia lleva solo las direcciones de los recursos y la línea "Plan:", no el plan
# completo: las incidencias de un repositorio público las ve cualquiera.
#
# Recursos no administrados (objetivo "cero recursos manuales", verificado con Cloud Asset
# Inventory): por cada carpeta de 1-org (common, dev, qa, prod), lista con Cloud Asset los recursos de su
# carpeta y los compara con todos los estados del bucket (scripts/unmanaged-resources.py).
# Falla si hay recursos que ningún estado administra y los lista en el resumen. El drift de
# arriba no los ve: un recurso creado a mano fuera de Terraform no cambia ningún plan.
# Identidad: GCP_AUDIT_SERVICE_ACCOUNT (solo lectura; docs/pipeline.md §2).
#
# Sin GCP: mientras GCP_ENABLED no sea "true", el flujo no hace nada y termina en verde.

name: drift

on:
  schedule:
    - cron: "17 12 * * *" # diario, 12:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift-gcp-datacenter
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.16.5"
  TF_IN_AUTOMATION: "1"

defaults:
  run:
    shell: bash
    working-directory: gcp-datacenter

jobs:
  roots:
    name: raíces
    if: vars.GCP_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      roots: ${{ steps.roots.outputs.roots }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: roots
        name: Listar raíces (sin 0-bootstrap)
        run: |
          # Misma definición de raíz que scripts/affected-roots.sh: directorio con versions.tf.
          json="["
          sep=""
          while IFS= read -r r; do
            stage="${r#stages/}"
            stage="${stage%%/*}"
            json="${json}${sep}{\"root\":\"${r}\",\"stage\":\"${stage}\"}"
            sep=","
          done < <(find stages -name versions.tf -type f -not -path '*/.terraform/*' |
            sed 's#/versions\.tf$##' | LC_ALL=C sort | grep -v -E '^stages/0-bootstrap(/|$)')
          json="${json}]"
          echo "roots=${json}" | tee -a "${GITHUB_OUTPUT}"

  plan:
    name: drift ${{ matrix.root }}
    if: vars.GCP_ENABLED == 'true' && needs.roots.outputs.roots != '[]'
    needs: roots
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.roots.outputs.roots) }}
    env:
      ROOT: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Autenticar con Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ fromJSON(vars.GCP_STAGE_SERVICE_ACCOUNTS)[matrix.stage] }}

      - name: Variables de la raíz
        env:
          TFVARS_JSON: ${{ vars.GCP_TFVARS_JSON }}
        run: |
          cd "${ROOT}"
          if [ -f terraform.tfvars.example ]; then
            cp terraform.tfvars.example terraform.tfvars
          fi
          printf '%s' "${TFVARS_JSON:-"{}"}" |
            jq --arg r "${ROOT}" '(.common // {}) + (.[$r] // {})' > zz-ci.auto.tfvars.json

      - name: terraform init
        env:
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: |
          cd "${ROOT}"
          terraform init -input=false -no-color -backend-config="bucket=${STATE_BUCKET}"

      - name: terraform plan -detailed-exitcode
        id: plan
        run: |
          cd "${ROOT}"
          set +e
          terraform plan -input=false -no-color -lock=false -detailed-exitcode -out=tfplan
          code=$?
          set -e
          case "${code}" in
            0) echo "drift=false" >> "${GITHUB_OUTPUT}" ;;
            2) echo "drift=true" >> "${GITHUB_OUTPUT}" ;;
            *) exit "${code}" ;;
          esac
          summary="${RUNNER_TEMP}/drift-summary.md"
          {
            echo '```'
            # Direcciones de recursos con cambios y la línea final del plan (máximo 200 líneas).
            terraform show -no-color tfplan |
              grep -E '^  # .* (will be|must be)|^Plan:|^Changes to Outputs' | head -n 200 || true
            echo '```'
          } > "${summary}"
          echo "summary=${summary}" >> "${GITHUB_OUTPUT}"
          cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Abrir o actualizar la incidencia de drift
        if: steps.plan.outputs.drift == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUMMARY_FILE: ${{ steps.plan.outputs.summary }}
        with:
          script: |
            const fs = require('fs');
            const root = process.env.ROOT;
            const label = 'drift';
            const title = `Drift: ${root}`;
            const marker = `<!-- drift:${root} -->`;
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const summary = fs.readFileSync(process.env.SUMMARY_FILE, 'utf8');
            const body = [
              marker,
              `La raíz \`${root}\` no coincide con su estado (plan con cambios).`,
              '',
              `Última detección: ${new Date().toISOString()} ([ejecución](${runUrl})).`,
              '',
              summary,
              '',
              'Ver el runbook de respuesta a drift en `gcp-datacenter/docs/runbooks/`.',
            ].join('\n');

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'd93f0b',
                description: 'La infraestructura no coincide con Terraform',
              });
            }

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: label, per_page: 100,
            });
            const existing = open.find(
              (i) => !i.pull_request && ((i.body || '').startsWith(marker) || i.title === title),
            );
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `El drift sigue presente (${runUrl}).`,
              });
              core.notice(`Incidencia #${existing.number} actualizada para ${root}.`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
              core.notice(`Incidencia #${created.data.number} abierta para ${root}.`);
            }

  unmanaged:
    name: recursos no administrados (${{ matrix.env }})
    if: vars.GCP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # common: proyectos del hub de red, seguridad, registros y respaldo (1-org).
        env: [common, dev, qa, prod]
    env:
      ENV_NAME: ${{ matrix.env }}
      STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Comprobar variables
        env:
          GCP_AUDIT_SERVICE_ACCOUNT: ${{ vars.GCP_AUDIT_SERVICE_ACCOUNT }}
        run: |
          missing=""
          for v in GCP_AUDIT_SERVICE_ACCOUNT STATE_BUCKET; do
            if [ -z "${!v:-}" ]; then
              missing="${missing} ${v}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Faltan variables de repositorio:${missing} (docs/pipeline.md §2)."
            exit 1
          fi

      - name: Autenticar con Workload Identity Federation (cuenta de auditoría)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_AUDIT_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Los estados crudos llevan valores sensibles: quedan en la carpeta temporal del runner y
      # no se suben como artefacto.
      - name: Descargar los estados del bucket
        run: |
          dir="${RUNNER_TEMP}/states"
          mkdir -p "${dir}"
          gcloud storage ls "gs://${STATE_BUCKET}/**/default.tfstate" > "${RUNNER_TEMP}/state-list.txt"
          while IFS= read -r url; do
            name="$(printf '%s' "${url#gs://"${STATE_BUCKET}"/}" | tr '/' '_')"
            gcloud storage cp --quiet "${url}" "${dir}/${name}"
          done < "${RUNNER_TEMP}/state-list.txt"
          ls "${dir}"
          [ -f "${dir}/1-org_default.tfstate" ] || {
            echo "::error::No está el estado de 1-org (gs://${STATE_BUCKET}/1-org/default.tfstate)."
            exit 1
          }

      - name: Listar la carpeta del entorno con Cloud Asset
        run: |
          folder="$(jq -r --arg e "${ENV_NAME}" '.outputs.folder_ids.value[$e] // empty' "${RUNNER_TEMP}/states/1-org_default.tfstate")"
          if [ -z "${folder}" ]; then
            echo "::error::La salida folder_ids de 1-org no tiene la carpeta ${ENV_NAME}."
            exit 1
          fi
          echo "Carpeta de ${ENV_NAME}: ${folder}"
          # VERIFICAR-EN-APPLY: cuota de la API cloudasset con la cuenta de auditoría.
          gcloud asset search-all-resources --scope="${folder}" --format=json > "${RUNNER_TEMP}/assets.json"

      - name: Comparar con los estados
        run: |
          args=()
          for s in "${RUNNER_TEMP}"/states/*; do
            args+=(--state "${s}")
          done
          {
            echo "### Recursos no administrados: ${ENV_NAME}"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"
          python3 scripts/unmanaged-resources.py --assets "${RUNNER_TEMP}/assets.json" "${args[@]}" \
            --summary "${GITHUB_STEP_SUMMARY}"
